<!DOCTYPE html>
<html lang="ru">
  <head>
    <script>
      // Тема до загрузки приложения (без белой вспышки). Вход, регистрация и лендинг — всегда светлые.
      try {
        var t = localStorage.getItem('fp_theme');
        var pub = /^\/(login|signup|welcome)(\/|$)/.test(location.pathname);
        if (!pub && (t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches))) document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/brand/flowpos-icon-64.png" />
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&subset=cyrillic&display=swap" rel="stylesheet" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FlowPOS — Платформа управления</title>
    <meta name="description" content="FlowPOS — учётная система, бухгалтерия по правилам РК и контроль торговых представителей в одной платформе. Работает с МойСклад, кассой FlowPOS и приложением FlowPOS Агент." />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
