version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: flowpos_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: flowpos
      POSTGRES_PASSWORD: flowpos123
      POSTGRES_DB: flowpos
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql

  redis:
    image: redis:7-alpine
    container_name: flowpos_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: flowpos_rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: flowpos
      RABBITMQ_DEFAULT_PASS: flowpos123
      RABBITMQ_DEFAULT_VHOST: flowpos
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  adminer:
    image: adminer
    container_name: flowpos_adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - postgres

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
