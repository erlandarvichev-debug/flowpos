# FlowPOS: веб + API и ИИ-помощник для Claude (MCP, app.example.kz/mcp), панель управления платформой (ad.example.kz).
# Заменить домены; один сертификат на оба имени:
#   certbot certonly --webroot -w /var/www/certbot --cert-name app.example.kz -d app.example.kz -d ad.example.kz
# Положить в /etc/nginx/sites-available/flowpos.conf и включить симлинком в sites-enabled.

limit_req_zone $binary_remote_addr zone=flowpos_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=flowpos_api:10m rate=30r/s;

server {
    listen 80;
    server_name app.example.kz ad.example.kz;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

# ── Веб-интерфейс и API ──
server {
    listen 443 ssl http2;
    server_name app.example.kz;

    ssl_certificate     /etc/letsencrypt/live/app.example.kz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.example.kz/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    client_max_body_size 25m;   # импорт выписок, файлы

    root /opt/flowpos/current/apps/web/dist;
    index index.html;

    # Статика сборки Vite — с хэшем в имени, кэшируем надолго
    location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; try_files $uri =404; }

    # Перебор паролей
    location = /api/v1/auth/login {
        limit_req zone=flowpos_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/snippets/flowpos-proxy.conf;
    }

    # Регистрация компании — та же защита от перебора, что и вход
    location = /api/v1/auth/register {
        limit_req zone=flowpos_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/snippets/flowpos-proxy.conf;
    }

    # FP-022: метрики — только для Prometheus на самом сервере (http://127.0.0.1:3000/api/v1/ops/metrics), снаружи их нет.
    location = /api/v1/ops/metrics { return 404; }

    # Управление платформой — только с адреса панели (ad.example.kz), с рабочего сайта клиентов его нет.
    location /api/v1/platform/ { return 404; }

    location /api/ {
        limit_req zone=flowpos_api burst=60 nodelay;
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/snippets/flowpos-proxy.conf;
        proxy_read_timeout 120s;   # отчёты, пересчёт себестоимости, ИС ЭСФ
    }

    # ИИ-помощник для клиентов (MCP для Claude, сервис :3100). У каждой компании свой коннектор:
    # https://app.example.kz/mcp/c/<код> (FlowPOS → Настройки → ИИ-помощник). /mcp — подсказка, где взять адрес.
    # OAuth сервиса живёт в корне сайта (MCP_PUBLIC_URL=https://app.example.kz): метаданные, регистрация клиента, вход.
    location ^~ /mcp/c/ {
        limit_req zone=flowpos_api burst=60 nodelay;
        proxy_pass http://127.0.0.1:3100;
        include /etc/nginx/snippets/flowpos-proxy.conf;
        proxy_buffering off;         # потоковые ответы MCP
        proxy_read_timeout 300s;
    }
    location = /mcp {
        limit_req zone=flowpos_api burst=60 nodelay;
        proxy_pass http://127.0.0.1:3100;
        include /etc/nginx/snippets/flowpos-proxy.conf;
        proxy_buffering off;         # потоковые ответы MCP
        proxy_read_timeout 300s;
    }
    location ^~ /.well-known/oauth- {
        limit_req zone=flowpos_api burst=60 nodelay;
        proxy_pass http://127.0.0.1:3100;
        include /etc/nginx/snippets/flowpos-proxy.conf;
    }
    location ~ ^/(authorize|token|register|revoke|docs)$ {
        limit_req zone=flowpos_api burst=60 nodelay;
        proxy_pass http://127.0.0.1:3100;
        include /etc/nginx/snippets/flowpos-proxy.conf;
    }
    location = /consent {
        limit_req zone=flowpos_login burst=5 nodelay;   # вход пользователя FlowPOS при подключении Claude
        proxy_pass http://127.0.0.1:3100;
        include /etc/nginx/snippets/flowpos-proxy.conf;
    }

    # SPA: все остальные пути — index.html (без кэша, чтобы обновления подхватывались)
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}

# ── Панель управления платформой (администраторы платформы) ──
# Тот же собранный веб: на адресе ad.* он показывает панель. Наружу — только вход и адреса /platform.
server {
    listen 443 ssl http2;
    server_name ad.example.kz;

    ssl_certificate     /etc/letsencrypt/live/app.example.kz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.example.kz/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    root /opt/flowpos/current/apps/web/dist;
    index index.html;

    location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; try_files $uri =404; }
    location = /robots.txt { default_type text/plain; return 200 "User-agent: *\nDisallow: /\n"; }

    location = /api/v1/auth/login {
        limit_req zone=flowpos_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/snippets/flowpos-proxy.conf;
    }
    location = /api/v1/auth/mfa/login {
        limit_req zone=flowpos_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/snippets/flowpos-proxy.conf;
    }
    location ~ ^/api/v1/auth/(refresh|logout|me)$ {
        limit_req zone=flowpos_api burst=60 nodelay;
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/snippets/flowpos-proxy.conf;
    }
    location = /api/v1/subscriptions/platform-admin {
        limit_req zone=flowpos_api burst=60 nodelay;
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/snippets/flowpos-proxy.conf;
    }
    location /api/v1/platform/ {
        limit_req zone=flowpos_api burst=60 nodelay;
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/snippets/flowpos-proxy.conf;
    }
    # Остальное API (учёт, касса, торговые) с адреса панели недоступно.
    location /api/ { return 404; }

    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
}

