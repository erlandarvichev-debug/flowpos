# FlowPOS: веб + API (app.example.kz) и MCP для клиентов (mcp.example.kz).
# Заменить домены; один сертификат на оба имени: certbot certonly --webroot -w /var/www/certbot -d app.example.kz -d mcp.example.kz
# Положить в /etc/nginx/sites-available/flowpos.conf и включить симлинком в sites-enabled.

limit_req_zone $binary_remote_addr zone=flowpos_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=flowpos_api:10m rate=30r/s;

server {
    listen 80;
    server_name app.example.kz mcp.example.kz;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

# ── Веб-интерфейс и API ──
server {
    listen 443 ssl http2;
    server_name app.example.kz;

    ssl_certificate     /etc/letsencrypt/live/app.example.kz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.example.kz/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    client_max_body_size 25m;   # импорт выписок, файлы

    root /opt/flowpos/current/apps/web/dist;
    index index.html;

    # Статика сборки Vite — с хэшем в имени, кэшируем надолго
    location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; try_files $uri =404; }

    # Перебор паролей
    location = /api/v1/auth/login {
        limit_req zone=flowpos_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/snippets/flowpos-proxy.conf;
    }

    # FP-022: метрики — только для Prometheus на самом сервере (http://127.0.0.1:3000/api/v1/ops/metrics), снаружи их нет.
    location = /api/v1/ops/metrics { return 404; }

    location /api/ {
        limit_req zone=flowpos_api burst=60 nodelay;
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/snippets/flowpos-proxy.conf;
        proxy_read_timeout 120s;   # отчёты, пересчёт себестоимости, ИС ЭСФ
    }

    # SPA: все остальные пути — index.html (без кэша, чтобы обновления подхватывались)
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}

# ── MCP для клиентов (Claude) ──
server {
    listen 443 ssl http2;
    server_name mcp.example.kz;

    ssl_certificate     /etc/letsencrypt/live/app.example.kz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.example.kz/privkey.pem;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location = /consent {
        limit_req zone=flowpos_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:3100;
        include /etc/nginx/snippets/flowpos-proxy.conf;
    }

    location / {
        limit_req zone=flowpos_api burst=60 nodelay;
        proxy_pass http://127.0.0.1:3100;
        include /etc/nginx/snippets/flowpos-proxy.conf;
        proxy_buffering off;         # потоковые ответы MCP
        proxy_read_timeout 300s;
    }
}
